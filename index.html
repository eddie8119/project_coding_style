    <script type="module">
      import { BRAND_LINK } from '/src/constants/link';

      const appUrl = BRAND_LINK.production;
      const ogImageUrl = new URL('/images/og-cover.png', appUrl).toString();

      document
        .querySelector('link[rel="canonical"]')
        ?.setAttribute('href', appUrl);

      document
        .querySelector('meta[property="og:url"]')
        ?.setAttribute('content', appUrl);

      document
        .querySelector('meta[property="og:image"]')
        ?.setAttribute('content', ogImageUrl);

      document
        .querySelector('meta[name="twitter:image"]')
        ?.setAttribute('content', ogImageUrl);

      const ldJson = document.querySelector('script[type="application/ld+json"]');
      if (ldJson?.textContent) {
        const data = JSON.parse(ldJson.textContent);
        data.url = appUrl;
        data.image = ogImageUrl;
        if (data.author && typeof data.author === 'object') {
          data.author.url = appUrl;
        }
        ldJson.textContent = JSON.stringify(data);
      }
    </script>
